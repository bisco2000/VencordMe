name: Upstream Auto-Sync Bot

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/Vendicated/Vencord.git

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      has_new: ${{ steps.compare.outputs.has_new }}
      upstream_version: ${{ steps.compare.outputs.upstream_version }}
      local_version: ${{ steps.compare.outputs.local_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/Vendicated/Vencord.git
          git fetch upstream main --tags || git fetch upstream main --tags || (echo "fetch failed, retrying with explicit refs"; git fetch upstream 'refs/tags/*:refs/tags/*' 'refs/heads/main:refs/remotes/upstream/main')

      - name: Compare versions
        id: compare
        run: |
          LOCAL_VER=$(python3 -c "import json;print(json.load(open('package.json'))['version'])")
          UPSTREAM_TAG=$(git tag --list 'v1.*' --sort=-v:refname --merged refs/remotes/upstream/main 2>/dev/null | head -1)
          UPSTREAM_VER=${UPSTREAM_TAG#v}
          echo "local=$LOCAL_VER upstream=$UPSTREAM_VER"
          echo "local_version=$LOCAL_VER" >> "$GITHUB_OUTPUT"
          echo "upstream_version=$UPSTREAM_VER" >> "$GITHUB_OUTPUT"
          NEWEST=$(printf '%s\n' "$LOCAL_VER" "$UPSTREAM_VER" | sort -V | tail -1)
          if [ "$NEWEST" != "$LOCAL_VER" ] && [ -n "$UPSTREAM_VER" ]; then
            echo "has_new=true"  >> "$GITHUB_OUTPUT"
          else
            echo "has_new=false" >> "$GITHUB_OUTPUT"
          fi

  sync:
    needs: check-upstream
    if: needs.check-upstream.outputs.has_new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "vencordme-bot"
          git config user.email "bisco2000+bot@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/Vendicated/Vencord.git
          git fetch upstream main --tags --no-tags || git fetch upstream main

      - name: Sync tracked paths from upstream
        run: |
          # Take upstream tree for everything EXCEPT our custom dirs
          git checkout upstream/main -- .
          git checkout HEAD -- installer src/userplugins .github/workflows/build.yml .github/workflows/release.yml .github/workflows/publish.yml

      - name: Reset version to upstream's and restore lockfile
        run: |
          git checkout upstream/main -- pnpm-lock.yaml packages/vencord-types/package.json

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.BOT_TOKEN }}
          commit-message: "feat(vencord-me): upgrade to upstream v${{ needs.check-upstream.outputs.upstream_version }}"
          title: "🤖 Upstream sync: v${{ needs.check-upstream.outputs.upstream_version }}"
          body: |
            ## 🤖 Upstream Auto-Sync

            Upstream **Vendicated/Vencord** is at **v${{ needs.check-upstream.outputs.upstream_version }}**; this repo is on **v${{ needs.check-upstream.outputs.local_version }}**.

            Synced all upstream-tracked paths, preserving:
            - `src/userplugins/pnygo` (custom plugin)
            - `installer/` (custom installer)
            - our workflow customizations

            After merge: tag `v1.x.y` to trigger Release Installer.
          branch: bot/upstream-sync
          delete-branch: true
          labels: upstream-sync
